<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Forum Diskusi</title>
    <link rel="stylesheet" href="css/diskusi.css" />
  </head>
  <body>
    <h2>💬 Forum Diskusi Materi</h2>

    <div id="info"></div>

    <textarea id="isi_pesan" placeholder="Tulis komentar..."></textarea>
    <br />
    <div class="button-group">
      <button onclick="kirimDiskusi()" class="send-btn">🚀 Kirim</button>

      <button onclick="kembali()" class="back-btn">← Kembali</button>
    </div>

    <hr />

    <div id="diskusiList"></div>

    <script>
      const params = new URLSearchParams(globalThis.location.search);
      const materiId = params.get("materiId");
      const token = localStorage.getItem("token");

      if (!materiId) {
        document.body.innerHTML = "<h3>❌ Materi tidak ditemukan</h3>";
        throw new Error("materiId null");
      }

      if (!token) {
        alert("Akses ditolak, silakan login");
        globalThis.location.href = "/login";
      }

      async function loadDiskusi() {
        try {
          const res = await fetch(`/api/diskusi/${materiId}`, {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });

          if (!res.ok) {
            throw new Error("Gagal mengambil diskusi");
          }

          const result = await res.json();
          const data = result.data || result;

          const container = document.getElementById("diskusiList");
          container.innerHTML = "";

          if (!data || data.length === 0) {
            container.innerHTML = "<p>Belum ada diskusi.</p>";
            return;
          }

          data.forEach(d => {
            const user = d.User ? d.User.nama : "Anonim";

            container.innerHTML += `
        <div class="chat-card">
          <b>👤 ${user}</b>
          <p>${d.isi_pesan}</p>
        </div>
      `;
          });

        } catch (err) {
          document.getElementById("diskusiList").innerHTML =
            "<p style='color:red'>❌ Error memuat diskusi</p>";
          console.error(err);
        }
      }

      async function kirimDiskusi() {
        const isi = document.getElementById("isi_pesan").value.trim();
        if (!isi) return alert("Pesan kosong");

        try {
          const res = await fetch("/api/diskusi", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              materiId,
              isi_pesan: isi
            })
          });

          if (!res.ok) throw new Error("Gagal kirim");

          document.getElementById("isi_pesan").value = "";
          loadDiskusi();

        } catch (err) {
          alert("Gagal mengirim diskusi");
          console.error(err);
        }
      }

      function kembali() {
          const role = localStorage.getItem("role");

          if (role === "pengajar") {
              globalThis.history.back();
          } else {
              globalThis.location.href = "/dashboard-siswa";
          }
      }

      loadDiskusi();
    </script>
  </body>
</html>
