<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Forum Diskusi</title>
    <link rel="stylesheet" href="css/diskusi.css" />
  </head>
  <body>
    <h2>💬 Forum Diskusi Materi</h2>

    <textarea id="isi_pesan" placeholder="Tulis komentar..."></textarea>

    <div class="button-group">
      <button id="btnKirim" onclick="kirimDiskusi()" class="send-btn">
        🚀 Kirim
      </button>

      <button
        id="btnBatal"
        onclick="batalEdit()"
        class="back-btn"
        style="display: none"
      >
        ❌ Batal
      </button>

      <button onclick="kembali()" class="back-btn">← Kembali</button>
    </div>

    <hr />

    <div id="diskusiList">Memuat diskusi...</div>

    <script>
      const params = new URLSearchParams(location.search);
      const materiId = params.get("materiId");
      const token = localStorage.getItem("token");
      const userId = Number(localStorage.getItem("userId"));
      let editId = null;

      if (!materiId) {
        document.body.innerHTML = "<h3>Materi tidak ditemukan</h3>";
        throw new Error("materiId null");
      }

      if (!token) {
        alert("Silakan login");
        location.href = "/login";
      }

      async function loadDiskusi() {
        try {
          const res = await fetch(`/api/diskusi/${materiId}`, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });
          if (res.status === 401) {
            alert("Session habis");
            localStorage.clear();
            location.href = "/login";
            return;
          }

          const result = await res.json();
          if (!res.ok) {
            return alert(result.message);
          }
          const data = result.data || result;
          const container = document.getElementById("diskusiList");
          if (data.length === 0) {
            container.innerHTML = "<p>Belum ada diskusi.</p>";
            return;
          }

          let html = "";
          data.forEach((d) => {
            const isOwner = d.userId === userId;
            const nama = d.User ? d.User.nama : "Anonim";
            html += `
            <div class="chat-wrapper ${isOwner ? "self" : "other"}">
              <div class="chat-card">
                <b>${nama}</b>
                <p>${d.isi_pesan}</p>
                ${
                  isOwner
                    ? `<div class="action-btn">
                        <button
                        onclick="editDiskusi(${d.id},'${d.isi_pesan.replaceAll("'", "\\'")}')">
                        ✏ Edit
                        </button>
                        <button
                        onclick="hapusDiskusi(${d.id})">
                        🗑 Hapus
                        </button>
                    </div>`
                    : ""
                }
              </div>
            </div>
            `;
          });

          container.innerHTML = html;
        } catch (err) {
          console.error(err);

          document.getElementById("diskusiList").innerHTML =
            "<p style='color:red'>Gagal memuat diskusi</p>";
        }
      }

      async function kirimDiskusi() {
        const isi = document.getElementById("isi_pesan").value.trim();

        if (!isi) {
          return alert("Komentar tidak boleh kosong");
        }
        let url = "/api/diskusi";
        let method = "POST";
        if (editId) {
          url = `/api/diskusi/${editId}`;
          method = "PUT";
        }

        try {
          const res = await fetch(url, {
            method,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              materiId,
              isi_pesan: isi,
            }),
          });

          const result = await res.json();
          if (!res.ok) {
            return alert(result.message);
          }
          batalEdit();
          loadDiskusi();
        } catch (err) {
          console.error(err);
          alert("Terjadi kesalahan");
        }
      }

      function editDiskusi(id, isi) {
        editId = id;
        document.getElementById("isi_pesan").value = isi;
        document.getElementById("isi_pesan").focus();
        document.getElementById("btnKirim").innerHTML = "💾 Update";
        document.getElementById("btnBatal").style.display = "inline-block";
      }

      function batalEdit() {
        editId = null;
        document.getElementById("isi_pesan").value = "";
        document.getElementById("btnKirim").innerHTML = "🚀 Kirim";
        document.getElementById("btnBatal").style.display = "none";
      }

      async function hapusDiskusi(id) {
        if (!confirm("Yakin ingin menghapus komentar?")) {
          return;
        }
        try {
          const res = await fetch(`/api/diskusi/${id}`, {
            method: "DELETE",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const result = await res.json();
          if (!res.ok) {
            return alert(result.message);
          }

          loadDiskusi();
        } catch (err) {
          console.error(err);
          alert("Gagal menghapus komentar");
        }
      }

      function kembali() {
        const role = localStorage.getItem("role");
        if (role === "pengajar") {
          location.href = "/dashboard-pengajar";
        } else {
          location.href = "/dashboard-siswa";
        }
      }
      loadDiskusi();
    </script>
  </body>
</html>
