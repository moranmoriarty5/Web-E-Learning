<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Siswa</title>
  <link rel="stylesheet" href="css/dashsiswa.css" />
</head>
<body>

<div class="container">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <h2>📘 E-Learning</h2>
    <p id="studentName"></p>

    <nav>
      <button onclick="toggleDarkMode()">🌙 Mode Gelap</button>
      <button onclick="logout()">🚪 Logout</button>
    </nav>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="content">
    <h1>📂 Daftar Materi</h1>

    <!-- FILTER -->
    <div class="filter-container">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 Cari materi..."
        oninput="filterMateri()"
      />

      <select id="filterMapel" onchange="filterMateri()">
        <option value="">Semua Mata Pelajaran</option>
      </select>
    </div>

    <!-- TABLE -->
    <table id="materiTable">
      <thead>
        <tr>
          <th>No</th>
          <th>Judul</th>
          <th>Mata Pelajaran</th>
          <th>File</th>
          <th>Forum</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

</div>

<script>
/* ================= AUTH ================= */
const nama = localStorage.getItem("nama");
const role = localStorage.getItem("role");
const token = localStorage.getItem("token");

if (!nama || role !== "siswa") {
  alert("Akses ditolak!");
  globalThis.location.href = "/login";
}

document.getElementById("studentName").textContent = "👩‍🎓 " + nama;

/* ================= UTIL ================= */
function logout() {
  localStorage.clear();
  globalThis.location.href = "/login";
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark")
  );
}

if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark");
}

/* ================= DATA ================= */
let allMateri = [];

/* ================= LOAD DATA ================= */
async function loadMateri() {
  const res = await fetch("/api/materi", {
    headers: { Authorization: `Bearer ${token}` }
  });

  const result = await res.json();
  allMateri = result.data || result;
  await renderMateri(allMateri);
  loadMataPelajaran();
}

async function loadMataPelajaran() {
  const res = await fetch("/api/mata-pelajaran");
  const result = await res.json();
  const mapel = result.data || result;

  const select = document.getElementById("filterMapel");

  mapel.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.nama_mapel;
    opt.textContent = m.nama_mapel;
    select.appendChild(opt);
  });
}

/* ================= RENDER ================= */
async function renderMateri(data) {
  const tbody = document.querySelector("#materiTable tbody");
  tbody.innerHTML = "";

  // Prepare parallel checks for submissions per materi
  await Promise.all(
    data.map(async (m, i) => {
      // fetch submissions for this materi
      let submitted = false;
      let submissionInfo = null;
      try {
        const res = await fetch(`/api/tugas/materi/${m.id}`);
        if (res.ok) {
          const result = await res.json();
          const list = result.data || result;
          const my = list.find(t => String(t.siswaId) === String(localStorage.getItem('userId')) || (t.User && String(t.User.id) === String(localStorage.getItem('userId'))));
          if (my) {
            submitted = true;
            submissionInfo = my;
          }
        }
      } catch (err) {
        console.error('Cek submission error', err);
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${m.judul}</td>
      <td>${m.MataPelajaran?.nama_mapel || "-"}</td>
      <td>
        <a href="${m.filePath}" target="_blank">📄 Lihat</a>
      </td>
      <td>
        <button onclick="openForum(${m.id})">💬 Diskusi</button>
      </td>
      <td>
        ${submitted ? `<span style="color:green">✅ Sudah dikumpulkan</span> <a href="${submissionInfo.filePath}" target="_blank">(Lihat)</a>` : `<button onclick="openTugas(${m.id})">📤 Submit Tugas</button>`}
      </td>
    `;
      tbody.appendChild(tr);
    })
  );
}

/* ================= FILTER ================= */
function filterMateri() {
  const keyword = document
    .getElementById("searchInput")
    .value.toLowerCase();

  const mapel = document.getElementById("filterMapel").value;

  const filtered = allMateri.filter(m =>
    m.judul.toLowerCase().includes(keyword) &&
    (mapel === "" || m.MataPelajaran?.nama_mapel === mapel)
  );

  renderMateri(filtered);
}

/* ================= FORUM ================= */
function openForum(materiId) {
  globalThis.location.href = `/diskusi.html?materiId=${materiId}`;
}

/* ================= INIT ================= */
loadMateri();

/* ================= SUBMIT TUGAS ================= */
function openTugas(materiId) {
  globalThis.location.href = `/tugas?materiId=${materiId}`;
}
</script>

</body>
</html>
