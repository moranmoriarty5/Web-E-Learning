<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Siswa</title>
    <link rel="stylesheet" href="css/dashsiswa.css" />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <h2>📘 E-Learning</h2>

        <p id="studentName"></p>

        <nav>
          <button onclick="location.href = '/edit-profile'">
            👤 Edit Profil
          </button>
          <button onclick="logout()">🚪 Logout</button>
        </nav>
      </aside>

      <main class="content">
        <h1>📚 Dashboard Siswa</h1>

        <div class="stats">
          <div class="card">
            <h3>Total Materi</h3>
            <span id="totalMateri">0</span>
          </div>

          <div class="card">
            <h3>Tugas Selesai</h3>
            <span id="tugasSelesai">0</span>
          </div>

          <div class="card">
            <h3>Mata Pelajaran</h3>
            <span id="totalMapel">0</span>
          </div>
        </div>

        <h2>📂 Daftar Materi</h2>

        <div class="filter-container">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 Cari materi..."
            oninput="filterMateri()"
          />

          <select id="filterMapel" onchange="filterMateri()">
            <option value="">Semua Mata Pelajaran</option>
          </select>
        </div>

        <!-- TABLE -->
        <table id="materiTable">
          <thead>
            <tr>
              <th>No</th>
              <th>Judul</th>
              <th>Mata Pelajaran</th>
              <th>File</th>
              <th>Forum</th>
              <th>Status Tugas</th>
            </tr>
          </thead>

          <tbody></tbody>
        </table>
      </main>
    </div>

    <script>
      const nama = localStorage.getItem("nama");
      const role = localStorage.getItem("role");
      const token = localStorage.getItem("token");
      const userId = localStorage.getItem("userId");

      if (!nama || role !== "siswa") {
        alert("Akses ditolak!");
        globalThis.location.href = "/login";
      }

      document.getElementById("studentName").textContent = "👩‍🎓 " + nama;

      function logout() {
        localStorage.clear();
        globalThis.location.href = "/login";
      }

      let allMateri = [];

      async function loadMateri() {
        try {
          const res = await fetch("/api/materi", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const result = await res.json();
          allMateri = result.data || result;
          await renderMateri(allMateri);
          loadMataPelajaran();
        } catch (error) {
          console.error(error);
          alert("Gagal memuat data materi");
        }
      }

      async function loadMataPelajaran() {
        const res = await fetch("/api/mata-pelajaran", {
          headers: { 
            Authorization: `Bearer ${token}` 
          },
        });

        const result = await res.json();

        const mapel = result.data || result;

        const select = document.getElementById("filterMapel");

        mapel.forEach((m) => {
          const opt = document.createElement("option");
          opt.value = m.nama_mapel;
          opt.textContent = m.nama_mapel;
          select.appendChild(opt);
        });
      }

      function updateStatistics(totalTugasSelesai) {
        document.getElementById("totalMateri").textContent = allMateri.length;

        const uniqueMapel = new Set(
          allMateri.map((m) => m.MataPelajaran?.nama_mapel),
        );

        document.getElementById("totalMapel").textContent = uniqueMapel.size;
        document.getElementById("tugasSelesai").textContent = totalTugasSelesai;
      }

      async function renderMateri(data) {
        const tbody = document.querySelector("#materiTable tbody");
        tbody.innerHTML = "";
        let tugasSelesai = 0;
        await Promise.all(
          data.map(async (m, i) => {
            let submitted = false;
            let submissionInfo = null;
            try {
              const res = await fetch(`/api/tugas/materi/${m.id}`, {
                headers: { 
                  Authorization: `Bearer ${token}` 
                },
              });

              if (res.ok) {
                const result = await res.json();
                const list = result.data || result;

                const my = list.find(
                  (t) =>
                    String(t.siswaId) === String(userId) ||
                    (t.User && String(t.User.id) === String(userId)),
                );

                if (my) {
                  submitted = true;
                  submissionInfo = my;
                  tugasSelesai++;
                }
              }
            } catch (err) {
              console.error(err);
            }

            const tr = document.createElement("tr");

            tr.innerHTML = `
              <td>${i + 1}</td>
              <td>${m.judul}</td>
              <td>${m.MataPelajaran?.nama_mapel || "-"}</td>
              <td><a href="${m.filePath}"target="_blank">📄 Lihat</a></td>

              <td><button 
                onclick="openForum(${m.id})"> 💬 Diskusi
              </button></td>
              <td>${
                submitted
                  ? `<span style="color:green">✅ Sudah Dikumpulkan</span>

                    <br>

                    <a href="${submissionInfo.filePath}"target="_blank">Lihat File</a>
                    <br><br>

                    <button
                    onclick="hapusTugas(${m.id})" class="delete-btn">🗑 Hapus Pengumpulan
                    </button>
                  `
                  : `
                    <button 
                    onclick="openTugas(${m.id})">📤 Submit Tugas
                    </button>
                  `
              }
              </td>
            `;

            tbody.appendChild(tr);
          }),
        );
        updateStatistics(tugasSelesai);
      }

      function filterMateri() {
        const keyword = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const mapel = document.getElementById("filterMapel").value;

        const filtered = allMateri.filter(
          (m) =>
            m.judul.toLowerCase().includes(keyword) &&
            (mapel === "" || m.MataPelajaran?.nama_mapel === mapel),
        );

        renderMateri(filtered);
      }

      function openForum(materiId) {
        globalThis.location.href = `/diskusi?materiId=${materiId}`;
      }

      function openTugas(materiId) {
        globalThis.location.href = `/tugas?materiId=${materiId}`;
      }

      async function hapusTugas(materiId) {
        if (!confirm("Hapus tugas yang sudah dikumpulkan?")) {
          return;
        }

        try {
          const res = await fetch(`/api/tugas/submit/${materiId}`, {
            method: "DELETE",
            headers: { 
              Authorization: `Bearer ${token}` 
            },
          });

          const result = await res.json();
          alert(result.message);
          loadMateri();
        } catch (err) {
          console.error(err);
          alert("Gagal menghapus tugas");
        }
      }
      loadMateri();
    </script>
  </body>
</html>
