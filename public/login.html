<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login E-Learning</title>
    <link rel="stylesheet" href="css/login.css">
  </head>
  <body>
    <form id="loginForm">
    <h1>Login E-Learning</h1>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Masuk</button>

    <div class="extra-buttons">
      <a href="/index.html" class="secondary-btn">
        ← Kembali ke Beranda
      </a>
  </div>
  </form>

    <script>
      localStorage.clear();
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const res = await fetch("/api/users/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (data.status === "success") {
          alert("Login berhasil!");
          localStorage.setItem("token", data.data.token);
          localStorage.setItem("userId", data.data.user.id);
          localStorage.setItem("role", data.data.user.role);
          localStorage.setItem("nama", data.data.user.nama);

          // Redirect berdasarkan role
          if (data.data.user.role === "pengajar") {
            globalThis.location.href = "/dashboard-pengajar";
          } else if (data.data.user.role === "admin") {
            globalThis.location.href = "/dashboard-admin";
          } else {
            globalThis.location.href = "/dashboard-siswa";
          }
        } else {
          alert("Login gagal: " + data.message);
        }
      });
    </script>
  </body>
</html>
